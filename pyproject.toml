# Declarative environment for the rig: `uv sync` creates .venv if missing and
# installs exactly this set. The scaffold is the vendored submodule, editable,
# so its source is used live (see CLAUDE.md).
[project]
name = "claude-swe"
version = "0"
requires-python = ">=3.11"
dependencies = [
    "mini-swe-agent",
    "sb-cli",
    "swebench",
]

[tool.uv.sources]
mini-swe-agent = { path = "vendor/mini-swe-agent", editable = true }
# Patched fork (branch feature/claude-swe-patches, off v4.1.0): evaluation with
# --namespace skips env/repo script construction, so marking is fully offline.
swebench = { path = "vendor/swebench", editable = true }
